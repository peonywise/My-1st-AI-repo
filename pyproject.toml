[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-shortcuts"
version = "0.1.0"
description = "A guided console shortcut for common AWS CLI operations."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
aws-shortcuts = "aws_shortcuts.cli:main"

[tool.setuptools.packages.find]
include = ["aws_shortcuts*"]
